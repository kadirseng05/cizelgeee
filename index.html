<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mavişim’in YKS Çizelgesi</title>
<style>
/* Mavişim’in YKS Çizelgesi — stil dosyası */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef6ff;--bg2:#d8e9ff;--card:rgba(255,255,255,.72);--sol:#fff;--tx:#0f2747;--mu:#5d7494;--a1:#2f80ff;--a2:#00c2ff;--a3:#6a5cff;--bd:rgba(47,128,255,.16);--ok:#14b87a;--sh:0 12px 32px rgba(30,90,200,.13);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07142b;--bg2:#0b1f44;--card:rgba(18,36,68,.72);--sol:#12264a;--tx:#eaf3ff;--mu:#8fa8cc;--a1:#4d9bff;--a2:#22d3ee;--a3:#8b7cff;--bd:rgba(120,170,255,.2);--sh:0 12px 32px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07142b;--bg2:#0b1f44;--card:rgba(18,36,68,.72);--sol:#12264a;--tx:#eaf3ff;--mu:#8fa8cc;--a1:#4d9bff;--a2:#22d3ee;--a3:#8b7cff;--bd:rgba(120,170,255,.2);--sh:0 12px 32px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* arka plan */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 16s ease-in-out infinite}
.blobs i:nth-child(1){width:420px;height:420px;background:var(--a2);top:-120px;right:-80px}
.blobs i:nth-child(2){width:360px;height:360px;background:var(--a3);bottom:-100px;left:-90px;animation-delay:-6s}
.blobs i:nth-child(3){width:260px;height:260px;background:var(--a1);top:45%;left:55%;animation-delay:-11s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.3)}}
@keyframes shine{to{background-position:200% 0}}

.app{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;animation:rise .7s both}
.eyebrow{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);font-weight:700}
h1{margin:4px 0 0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
h1 span{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(12px);font-size:19px;box-shadow:var(--sh);transition:transform .3s}
.ico:hover{transform:rotate(25deg) scale(1.08)}

.layout{display:grid;grid-template-columns:310px 1fr;gap:20px;margin-top:22px;align-items:start}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:18px}
.side{display:grid;gap:14px;position:sticky;top:16px}
.side .card{animation:rise .7s both}
.side .card:nth-child(2){animation-delay:.1s}.side .card:nth-child(3){animation-delay:.2s}
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--bd)}
.ring .fg{stroke:url(#g);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:800}
.hero h3,.cd h3{margin:0;font-size:13px;color:var(--mu);font-weight:600}
.hero p{margin:4px 0 0;font-weight:700;font-size:17px}
.cd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cd strong{font-size:42px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.cd small{display:block;color:var(--mu);font-size:12px;margin-bottom:4px}
.cd input{border:1px solid var(--bd);background:var(--sol);color:var(--tx);border-radius:10px;padding:6px;font:inherit;font-size:12px}
.q{font-size:14px;line-height:1.5;font-style:italic;color:var(--mu)}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;animation:rise .7s .15s both}
.strip button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;border-radius:18px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(12px);font-weight:700;font-size:13px;transition:transform .25s,box-shadow .25s,background .25s}
.strip button:hover{transform:translateY(-3px)}
.strip button.on{background:linear-gradient(145deg,var(--a1),var(--a3));color:#fff;transform:translateY(-5px);box-shadow:0 12px 26px rgba(47,128,255,.4)}
.strip button.td span:first-child::after{content:"•";margin-left:3px;color:var(--a2)}
.rg{--p:0;position:relative;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;font-size:11px}
.rg::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--sol)}
.rg b{position:relative;color:var(--tx)}

.bar2{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;gap:10px}
.bar2 h2{margin:0;font-size:20px;font-weight:800}
.bar2 small{color:var(--mu);font-weight:600;margin-left:8px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mu);transition:all .25s}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff;box-shadow:0 4px 12px rgba(47,128,255,.35)}

/* gün görünümü */
.slot{display:grid;grid-template-columns:58px 1fr;gap:12px;margin-bottom:8px}
.anim .slot{animation:rise .55s calc(var(--i)*35ms) both}
.hr{text-align:right;padding-top:12px;font-weight:800;font-size:13px;color:var(--mu)}
.slot.now .hr{color:var(--a1)}
.slot.now .hr::after{content:"";display:inline-block;width:8px;height:8px;margin-left:6px;border-radius:50%;background:var(--a2);box-shadow:0 0 0 0 var(--a2);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
.tk{display:grid;gap:8px}
.add{border:1.5px dashed var(--bd);background:none;border-radius:14px;padding:9px;color:var(--a1);font-weight:700;font-size:13px;opacity:.55;transition:all .25s}
.add:hover{opacity:1;background:var(--card);transform:translateY(-1px)}
.t{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--sol);border:1px solid var(--bd);border-left:5px solid var(--sc);box-shadow:var(--sh);transition:opacity .3s,transform .25s}
.t:hover{transform:translateX(3px)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--sc);background:none;color:transparent;font-size:15px;font-weight:800;transition:all .25s}
.t.done .ck{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}
.t.done{opacity:.6}.t.done .tt{text-decoration:line-through}
.tt{font-weight:700;font-size:15px}
.tm{font-size:12px;color:var(--mu);margin-top:3px}
.b{display:inline-block;font-size:11px;padding:2px 8px;margin-right:6px;border-radius:99px;color:#fff;background:linear-gradient(135deg,var(--a3),var(--a2))}
.hp{background:var(--bd);color:var(--a1);border-radius:6px;padding:1px 6px;font-weight:700}
.x{border:0;background:none;color:var(--mu);font-size:20px;opacity:.5}.x:hover{opacity:1;color:#e5484d}

/* hafta görünümü (yatay pano) */
.wk{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.anim .col{animation:rise .6s calc(var(--i)*70ms) both}
.col{scroll-snap-align:start;padding:14px;display:flex;flex-direction:column;gap:8px}
.col.td{outline:2px solid var(--a2)}
.col h3{margin:0 0 4px;display:flex;justify-content:space-between;font-size:15px}
.col h3 small{color:var(--mu)}

/* pencere */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:rgba(5,15,40,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.md{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--sol);border-radius:28px 28px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(60px);transition:transform .35s cubic-bezier(.2,.9,.3,1.15)}
.ov.on .md{transform:none}
.md h4{margin:0 0 6px;font-size:19px}
.md label{display:block;margin:12px 0 5px;font-size:12px;font-weight:700;color:var(--mu)}
.md select,.md textarea,.md input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.md .seg{background:var(--bg)}.md .seg button{flex:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:16px;padding:13px;border:0;border-radius:14px;color:#fff;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--a1),var(--a3));box-shadow:0 10px 24px rgba(47,128,255,.35);transition:transform .2s}
.go:active{transform:scale(.97)}
.ghost{width:100%;margin-top:8px;padding:10px;border:0;background:none;color:var(--mu);font-weight:600}

#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.cf{position:absolute;top:-20px;left:var(--x);width:9px;height:15px;background:var(--c);border-radius:2px;animation:fall 1.8s var(--d) ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (min-width:700px){.ov{place-items:center}.md{border-radius:28px}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr}.q{display:none}}
@media (max-width:520px){.strip{gap:5px}.slot{grid-template-columns:46px 1fr;gap:8px}.hero{gap:12px}.ring{width:92px;height:92px}.bar2{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* hedefler, bildirimler, uyarı */
.side .card:nth-child(4){animation-delay:.3s}.side .card:nth-child(5){animation-delay:.4s}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gh h3,.nt h3{margin:0 0 8px;font-size:14px}.gh h3{margin:0}
.mini{border:1px solid var(--bd);background:var(--sol);color:var(--a1);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;margin-top:6px;transition:transform .2s}
.mini:hover{transform:translateY(-2px)}
.mu{color:var(--mu);font-size:13px;margin:0}
.g{padding:12px 0;border-top:1px solid var(--bd)}.g:first-child{border:0;padding-top:0}
.gt{display:flex;justify-content:space-between;font-size:14px}
.gb{height:8px;border-radius:99px;background:var(--bd);margin:8px 0 4px;overflow:hidden}
.gb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a2),var(--a3));transition:width .6s}
.gm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.gp{display:flex;gap:6px;margin-top:6px}
.gp button{flex:1;border:1px solid var(--bd);background:var(--sol);border-radius:10px;padding:5px;font-weight:700;font-size:12px}
.nl{display:block;font-size:12px;color:var(--mu);margin-top:10px}
.nl select{border:1px solid var(--bd);background:var(--sol);color:var(--tx);border-radius:8px;padding:3px}
.nl2{display:grid;gap:6px;margin:10px 0 4px}
.nl2 input{padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--sol);color:var(--tx);font:inherit;font-size:13px}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;z-index:40;pointer-events:none}
.toast{max-width:92%;padding:12px 18px;border-radius:16px;color:#fff;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--a1),var(--a3));box-shadow:0 12px 30px rgba(47,128,255,.45);animation:rise .4s both}
@media (max-width:900px){main{order:-1}}

</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>

<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">YKS yolculuğu · her gün bir adım</p>
      <h1>Mavişim’in <span>YKS Çizelgesi</span></h1>
    </div>
    <button class="ico" id="theme" aria-label="Tema değiştir">🌙</button>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="card hero">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a3)"/></linearGradient></defs>
            <circle class="bgc" cx="60" cy="60" r="52"/>
            <circle class="fg" id="rf" cx="60" cy="60" r="52"/>
          </svg>
          <b id="rp">0%</b>
        </div>
        <div><h3>Haftalık ilerleme</h3><p id="rs">0 / 0 görev</p></div>
      </section>
      <section class="card cd">
        <div><h3>YKS’ye kalan gün</h3><strong id="cd">–</strong></div>
        <div><small>Sınav tarihi</small><input type="date" id="cdate"></div>
      </section>
      <section class="card q" id="quote"></section>
      <section class="card goals">
        <div class="gh"><h3>🎯 Hedeflerim</h3><button class="mini" id="gadd">+ Hedef</button></div>
        <div id="glist"></div>
      </section>
      <section class="card nt">
        <h3>🔔 Hatırlatıcılar</h3>
        <p class="mu" id="ns"></p>
        <button class="mini" id="nbtn">Bildirimleri aç</button>
        <label class="nl">Unutursa her <select id="nint"><option value="15">15</option><option value="30">30</option><option value="60">60</option></select> dk’da bir tekrar hatırlat</label>
        <div class="nl2"><input type="email" id="mto" placeholder="E-posta adresi"><button class="mini" id="mail">✉️ Bugünün planını e-postala</button></div>
        <button class="mini" id="ics">📅 Haftayı takvime aktar (.ics)</button>
      </section>
    </aside>

    <main>
      <nav class="strip" id="strip" aria-label="Günler"></nav>
      <div class="bar2">
        <h2><span id="dh">Gün</span><small id="dc"></small></h2>
        <div class="seg" id="view"><button data-v="day">Dikey</button><button data-v="week">Yatay</button></div>
      </div>
      <div id="list"></div>
    </main>
  </div>
</div>

<div class="ov" id="ov"><div class="md">
  <h4>Yeni görev</h4>
  <label>Görev türü</label>
  <div class="seg" id="kind"><button data-v="0" class="on">Kendi görevim</button><button data-v="1">🎯 Görevlendirme</button></div>
  <div class="row">
    <div><label>Gün</label><select id="mday"></select></div>
    <div><label>Saat</label><select id="mhour"></select></div>
  </div>
  <label>Sınav</label>
  <div class="seg" id="exam"><button data-v="TYT" class="on">TYT</button><button data-v="AYT">AYT</button></div>
  <label>Ders</label><select id="sub"></select>
  <label>Konu</label><select id="top"></select>
  <label>Not (kaç soru, hangi kaynak…)</label>
  <textarea id="note" rows="2"></textarea>
  <button class="go" id="save">Çizelgeye ekle</button>
  <button class="ghost" id="cancel">Vazgeç</button>
</div></div>

<div class="ov" id="gov"><div class="md">
  <h4>Yeni hedef</h4>
  <label>Hedef</label><input id="gt" placeholder="Bu hafta matematik soru çözümü">
  <div class="row">
    <div><label>Sayı</label><input id="gn" type="number" min="1" value="100"></div>
    <div><label>Birim</label><input id="gu" value="soru"></div>
  </div>
  <label>Bitiş tarihi (isteğe bağlı)</label><input id="gd" type="date">
  <button class="go" id="gsave">Hedefi ekle</button>
  <button class="ghost" id="gcancel">Vazgeç</button>
</div></div>

<div id="conf"></div>
<div id="toasts"></div>
<script>
/* Mavişim’in YKS Çizelgesi — script dosyası */
var D = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
var DF = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
var H = []; for (var h = 7; h <= 23; h++) H.push(h);
var P = function (s) { return s.split("|"); };

var T = {
  TYT: {
    "Matematik": P("Temel Kavramlar|Sayı Basamakları|Bölme-Bölünebilme|EBOB-EKOK|Rasyonel Sayılar|Mutlak Değer-Eşitsizlik|Üslü Sayılar|Köklü Sayılar|Çarpanlara Ayırma|Oran-Orantı|Denklemler|Problemler|Kümeler|Fonksiyonlar|Permütasyon-Kombinasyon-Olasılık|Veri-İstatistik"),
    "Geometri": P("Açılar|Üçgenler|Çokgenler-Dörtgenler|Çember-Daire|Analitik Geometri|Katı Cisimler"),
    "Türkçe": P("Sözcükte Anlam|Cümlede Anlam|Paragraf|Ses Bilgisi|Yazım Kuralları|Noktalama|Sözcük Türleri|Cümlenin Ögeleri|Anlatım Bozukluğu"),
    "Fizik": P("Fizik Bilimine Giriş|Madde ve Özellikleri|Kuvvet ve Hareket|İş-Güç-Enerji|Isı-Sıcaklık|Elektrostatik|Elektrik Akımı|Manyetizma|Basınç|Dalgalar|Optik"),
    "Kimya": P("Kimya Bilimi|Atom ve Periyodik Sistem|Kimyasal Türler Arası Etkileşim|Maddenin Halleri|Kimyasal Hesaplamalar|Karışımlar|Asit-Baz-Tuz"),
    "Biyoloji": P("Canlıların Ortak Özellikleri|Hücre|Hücre Bölünmeleri|Kalıtım|Ekosistem|Sınıflandırma|Sistemler"),
    "Tarih": P("İslamiyet Öncesi Türk Tarihi|İlk Türk-İslam Devletleri|Osmanlı Yükselme|Osmanlı Gerileme-Dağılma|Kurtuluş Savaşı|Atatürk İlke ve İnkılapları"),
    "Coğrafya": P("Doğa ve İnsan|Harita Bilgisi|İklim|Yerşekilleri|Nüfus-Yerleşme|Ekonomik Faaliyetler|Türkiye Coğrafyası"),
    "Felsefe": P("Felsefeye Giriş|Bilgi Felsefesi|Varlık Felsefesi|Ahlak Felsefesi|Siyaset Felsefesi|Sanat Felsefesi"),
    "Din Kültürü": P("İnanç|İbadet|Ahlak|Hz. Muhammed|Vahiy ve Akıl")
  },
  AYT: {
    "Matematik": P("Polinomlar|İkinci Dereceden Denklemler|Parabol|Trigonometri|Logaritma|Diziler|Limit|Türev|İntegral|Permütasyon-Olasılık-Binom"),
    "Geometri": P("Üçgenler|Çember ve Daire|Analitik Geometri|Çemberin Analitiği|Katı Cisimler"),
    "Fizik": P("Vektörler|Bağıl Hareket|Newton Yasaları|Atışlar|İş-Enerji-Güç|İtme-Momentum|Tork-Denge|Elektrik ve Manyetizma|Çembersel Hareket|Basit Harmonik Hareket|Dalga Mekaniği|Modern Fizik"),
    "Kimya": P("Modern Atom Teorisi|Gazlar|Çözeltiler|Kimyasal Tepkimelerde Enerji|Hız|Denge|Asit-Baz Dengesi|Elektrokimya|Organik Kimya"),
    "Biyoloji": P("Sinir Sistemi|Endokrin Sistem|Duyu Organları|Destek ve Hareket|Sindirim-Dolaşım-Solunum|Boşaltım-Üreme|Genden Proteine|Fotosentez-Kemosentez|Hücresel Solunum|Bitki Biyolojisi|Komünite ve Popülasyon"),
    "Edebiyat": P("Şiir Bilgisi|Edebi Sanatlar|Divan Edebiyatı|Halk Edebiyatı|Tanzimat|Servet-i Fünun|Milli Edebiyat|Cumhuriyet Dönemi|Hikâye-Roman|Tiyatro"),
    "Tarih": P("Osmanlı Kültür ve Uygarlık|XVII. Yüzyıl|XVIII-XIX. Yüzyıl|Kurtuluş Savaşı|Atatürk Dönemi|Çağdaş Dünya Tarihi"),
    "Coğrafya": P("Ekosistem|Nüfus Politikaları|Şehirleşme|Ekonomik Faaliyetler|Küresel Ortam|Çevre ve Toplum")
  }
};
var SC = { "Matematik":"#2f80ff","Geometri":"#6a5cff","Türkçe":"#f59e0b","Fizik":"#06b6d4","Kimya":"#14b8a6","Biyoloji":"#22a65a","Tarih":"#c2762b","Coğrafya":"#0ea5e9","Felsefe":"#a855f7","Din Kültürü":"#8a7a5a","Edebiyat":"#ec4899" };
var QUOTES = ["Küçük adımlar büyük sonuçlar getirir.","Bugün yaptığın her soru, sınav günü sana güven olarak döner.","Mükemmel olmak şart değil, vazgeçmemek yeter.","Zor konular da bir gün kolay görünür; sen devam et.","Dinlenmek de planın bir parçasıdır.","Düne bakıp üzülme, bugüne bak ve başla.","Hedefin seni çağırıyor, bir adım daha at."];

/* depolama */
function ld(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function sv(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var S = ld("yks", []), view = ld("yksView", "day"), DATE = ld("yksDate", "2027-06-19");
var tdy = (new Date().getDay() + 6) % 7, day = tdy, kind = 0, exam = "TYT";

var $ = function (i) { return document.getElementById(i); };
var sc = function (s) { return SC[s] || "#2f80ff"; };
var hh = function (h) { return (h < 10 ? "0" : "") + h + ":00"; };
var pct = function (a) { return a.length ? Math.round(a.filter(function (t) { return t.done; }).length / a.length * 100) : 0; };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }
function doneTopic(ex, su, to) { return S.some(function (t) { return t.done && t.ex == ex && t.su == su && t.to == to; }); }

function taskHTML(t, showHour) {
  return '<div class="t' + (t.done ? " done" : "") + '" style="--sc:' + sc(t.su) + '">' +
    '<button class="ck" data-c="' + t.id + '" aria-label="Tamamla">✓</button>' +
    '<div><div class="tt">' + (t.as ? '<span class="b">🎯 Görev</span>' : "") + esc(t.su) + " · " + esc(t.to) + '</div>' +
    '<div class="tm">' + (showHour ? '<span class="hp">' + hh(t.h) + '</span> ' : "") + t.ex + (t.note ? " · " + esc(t.note) : "") + '</div></div>' +
    '<button class="x" data-x="' + t.id + '" aria-label="Sil">×</button></div>';
}

function render(anim) {
  var wp = pct(S);
  $("rp").textContent = wp + "%";
  $("rf").style.strokeDashoffset = 327 * (1 - wp / 100);
  $("rs").textContent = S.filter(function (t) { return t.done; }).length + " / " + S.length + " görev";

  $("strip").innerHTML = D.map(function (d, i) {
    var a = S.filter(function (t) { return t.day == i; });
    return '<button class="' + (i == day && view == "day" ? "on" : "") + (i == tdy ? " td" : "") + '" data-d="' + i + '"><span>' + d + '</span><span class="rg" style="--p:' + pct(a) + '"><b>' + a.length + '</b></span></button>';
  }).join("");

  [].forEach.call($("view").children, function (b) { b.classList.toggle("on", b.dataset.v == view); });
  var L = $("list"); L.className = anim ? "anim" : "";

  if (view == "day") {
    var dd = S.filter(function (t) { return t.day == day; }), dn = dd.filter(function (t) { return t.done; }).length;
    $("dh").textContent = DF[day];
    $("dc").textContent = dn + "/" + dd.length + " tamamlandı" + (dd.length && dn == dd.length ? " 🎉" : "");
    var nowH = new Date().getHours();
    L.innerHTML = H.map(function (h, i) {
      var ts = dd.filter(function (t) { return t.h == h; });
      return '<div class="slot' + (day == tdy && h == nowH ? " now" : "") + '" style="--i:' + i + '"><div class="hr">' + hh(h) + '</div><div class="tk">' +
        ts.map(function (t) { return taskHTML(t, false); }).join("") +
        '<button class="add" data-a="' + day + "," + h + '">+ Görev ekle</button></div></div>';
    }).join("");
  } else {
    $("dh").textContent = "Haftalık pano";
    $("dc").textContent = S.length + " görev";
    L.innerHTML = '<div class="wk">' + D.map(function (d, i) {
      var a = S.filter(function (t) { return t.day == i; }).sort(function (x, y) { return x.h - y.h; });
      return '<section class="card col' + (i == tdy ? " td" : "") + '" style="--i:' + i + '"><h3>' + DF[i] + '<small>' + pct(a) + '%</small></h3>' +
        a.map(function (t) { return taskHTML(t, true); }).join("") +
        '<button class="add" data-a="' + i + ',9">+ Görev ekle</button></section>';
    }).join("") + "</div>";
  }
}

/* yan paneller */
function updCd() {
  var n = Math.ceil((new Date(DATE + "T09:00:00") - new Date()) / 864e5);
  $("cd").textContent = isNaN(n) ? "–" : Math.max(n, 0);
}
$("cdate").value = DATE;
$("cdate").onchange = function () { DATE = this.value; sv("yksDate", DATE); updCd(); };
$("quote").textContent = "“" + QUOTES[tdy] + "”";

/* tema */
var root = document.documentElement;
function isDark() { return root.dataset.theme ? root.dataset.theme == "dark" : matchMedia("(prefers-color-scheme:dark)").matches; }
var th = ld("yksTheme", null); if (th) root.dataset.theme = th;
function icon() { $("theme").textContent = isDark() ? "☀️" : "🌙"; }
$("theme").onclick = function () { var n = isDark() ? "light" : "dark"; root.dataset.theme = n; sv("yksTheme", n); icon(); };
icon();

/* konfeti */
function confetti() {
  var c = ["#2f80ff", "#00c2ff", "#6a5cff", "#14b87a", "#ffd166"], s = "";
  for (var i = 0; i < 46; i++) s += '<i class="cf" style="--x:' + Math.random() * 100 + "%;--c:" + c[i % 5] + ";--d:" + Math.random() * .5 + 's"></i>';
  $("conf").innerHTML = s; setTimeout(function () { $("conf").innerHTML = ""; }, 2600);
}

/* pencere */
function fillSub() { $("sub").innerHTML = Object.keys(T[exam]).map(function (s) { return "<option>" + s + "</option>"; }).join(""); fillTop(); }
function fillTop() { var s = $("sub").value; $("top").innerHTML = T[exam][s].map(function (t) { return "<option>" + (doneTopic(exam, s, t) ? "✓ " : "") + t + "</option>"; }).join(""); }
function seg(id, fn) { $(id).onclick = function (e) { var b = e.target.closest("button"); if (!b) return; [].forEach.call($(id).children, function (x) { x.classList.remove("on"); }); b.classList.add("on"); fn(b.dataset.v); }; }
seg("kind", function (v) { kind = +v; });
seg("exam", function (v) { exam = v; fillSub(); });
seg("view", function (v) { view = v; sv("yksView", v); render(true); });
$("sub").onchange = fillTop;
$("mday").innerHTML = DF.map(function (d, i) { return '<option value="' + i + '">' + d + "</option>"; }).join("");
$("mhour").innerHTML = H.map(function (h) { return '<option value="' + h + '">' + hh(h) + "</option>"; }).join("");
$("cancel").onclick = function () { $("ov").classList.remove("on"); };
$("ov").onclick = function (e) { if (e.target == this) this.classList.remove("on"); };
$("save").onclick = function () {
  S.push({ id: Date.now() + "" + Math.floor(Math.random() * 99), day: +$("mday").value, h: +$("mhour").value, ex: exam, su: $("sub").value, to: $("top").value.replace(/^✓ /, ""), note: $("note").value.trim(), as: kind == 1, done: false });
  sv("yks", S); day = +$("mday").value; $("ov").classList.remove("on"); render(false);
};

/* tıklamalar */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-d],[data-c],[data-x],[data-a]"); if (!el) return;
  var d = el.dataset;
  if (d.d) { day = +d.d; if (view == "week") { view = "day"; sv("yksView", view); } render(true); }
  if (d.a) { var p = d.a.split(","); $("mday").value = p[0]; $("mhour").value = p[1]; $("note").value = ""; fillSub(); $("ov").classList.add("on"); }
  if (d.x) { S = S.filter(function (t) { return t.id != d.x; }); sv("yks", S); render(false); }
  if (d.c) {
    var t = S.filter(function (t) { return t.id == d.c; })[0]; t.done = !t.done; sv("yks", S);
    var a = S.filter(function (x) { return x.day == t.day; });
    render(false); if (t.done && a.every(function (x) { return x.done; })) confetti();
  }
});

/* hedefler */
var G = ld("yksG", []);
function renderG() {
  $("glist").innerHTML = G.length ? G.map(function (g) {
    var p = Math.min(100, Math.round(g.cur / g.tar * 100));
    var left = g.due ? Math.ceil((new Date(g.due + "T23:59:00") - new Date()) / 864e5) : null;
    return '<div class="g"><div class="gt"><b>' + esc(g.t) + '</b><button class="x" data-gx="' + g.id + '" aria-label="Sil">×</button></div>' +
      '<div class="gb"><i style="width:' + p + '%"></i></div>' +
      '<div class="gm"><span>' + g.cur + " / " + g.tar + " " + esc(g.u) + "</span>" + (left !== null ? "<span>" + (left >= 0 ? left + " gün kaldı" : "süre doldu") + "</span>" : "") + "</div>" +
      '<div class="gp"><button data-gp="' + g.id + ',-1">−1</button><button data-gp="' + g.id + ',1">+1</button><button data-gp="' + g.id + ',10">+10</button></div></div>';
  }).join("") : '<p class="mu">Henüz hedef yok. Mesela “Bu hafta 200 matematik sorusu”.</p>';
}
function toast(m) { var d = document.createElement("div"); d.className = "toast"; d.textContent = m; $("toasts").appendChild(d); setTimeout(function () { d.remove(); }, 6500); }
$("gadd").onclick = function () { $("gt").value = ""; $("gd").value = ""; $("gov").classList.add("on"); };
$("gcancel").onclick = function () { $("gov").classList.remove("on"); };
$("gov").onclick = function (e) { if (e.target == this) this.classList.remove("on"); };
$("gsave").onclick = function () {
  var t = $("gt").value.trim(), n = +$("gn").value; if (!t || !(n > 0)) return;
  G.push({ id: Date.now() + "", t: t, tar: n, u: $("gu").value.trim(), due: $("gd").value, cur: 0 });
  sv("yksG", G); $("gov").classList.remove("on"); renderG();
};
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-gx],[data-gp]"); if (!el) return; var d = el.dataset;
  if (d.gx) G = G.filter(function (g) { return g.id != d.gx; });
  if (d.gp) {
    var p = d.gp.split(","), g = G.filter(function (x) { return x.id == p[0]; })[0], was = g.cur >= g.tar;
    g.cur = Math.max(0, g.cur + +p[1]);
    if (!was && g.cur >= g.tar) { confetti(); toast("🎉 Hedefe ulaştın: " + g.t); }
  }
  sv("yksG", G); renderG();
});

/* bildirimler */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
function notify(t, b) {
  toast(t + " — " + b);
  if (!("Notification" in window) || Notification.permission != "granted") return;
  var n = function () { try { new Notification(t, { body: b }); } catch (e) {} };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
    navigator.serviceWorker.getRegistration().then(function (r) { r ? r.showNotification(t, { body: b }) : n(); }).catch(n);
  else n();
}
function ns() {
  var on = ld("yksOn", false), p = ("Notification" in window) ? Notification.permission : "yok";
  $("ns").textContent = on && p == "granted" ? "Açık ✓ Site bir Chrome sekmesinde açıkken çalışma saatinde hatırlatır."
    : p == "denied" ? "Tarayıcı bildirimi engelledi. Adres çubuğundaki kilit simgesinden izin ver."
    : p == "yok" ? "Bu tarayıcı bildirim desteklemiyor, sayfa içi uyarı kullanılır."
    : on ? "Açık (sayfa içi uyarı)." : "Kapalı.";
  $("nbtn").textContent = on ? "Bildirimleri kapat" : "Bildirimleri aç";
}
$("nbtn").onclick = function () {
  if (ld("yksOn", false)) { sv("yksOn", false); ns(); return; }
  var go = function () { sv("yksOn", true); ns(); notify("✅ Bildirimler açık", "Çalışma saatinde sana haber vereceğim."); tick(); };
  if (!("Notification" in window)) { go(); return; }
  try { Notification.requestPermission().then(go).catch(go); } catch (e) { Notification.requestPermission(go); }
};
$("nint").value = ld("yksInt", "30");
$("nint").onchange = function () { sv("yksInt", this.value); };
var N = ld("yksN", {});
function tick() {
  if (!ld("yksOn", false)) return;
  var now = new Date(), ms = +now, ds = now.toDateString(), nd = (now.getDay() + 6) % 7, gap = +$("nint").value * 6e4;
  S.forEach(function (t) {
    if (t.done || t.day != nd) return;
    var st = new Date(now.getFullYear(), now.getMonth(), now.getDate(), t.h).getTime();
    if (ms < st || ms > st + 4 * 36e5) return;
    var l = N[t.id] && N[t.id].d == ds ? N[t.id].ts : 0, tx = t.su + " · " + t.to;
    if (!l) { notify("⏰ Çalışma vakti", tx); N[t.id] = { d: ds, ts: ms }; }
    else if (ms - l >= gap) { notify("👀 Unuttun mu?", tx + " henüz bitmedi"); N[t.id] = { d: ds, ts: ms }; }
  });
  sv("yksN", N);
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });

/* e-posta ve takvim */
$("mto").value = ld("yksMail", "");
$("mto").onchange = function () { sv("yksMail", this.value); };
$("mail").onclick = function () {
  var a = S.filter(function (t) { return t.day == tdy; }).sort(function (x, y) { return x.h - y.h; });
  if (!a.length) { toast("Bugün için görev yok."); return; }
  var body = a.map(function (t) { return hh(t.h) + " " + (t.done ? "[x] " : "[ ] ") + t.su + " · " + t.to; }).join("\n");
  var l = document.createElement("a");
  l.href = "mailto:" + encodeURIComponent($("mto").value) + "?subject=" + encodeURIComponent("Bugünün YKS planı") + "&body=" + encodeURIComponent(body);
  l.click();
};
$("ics").onclick = function () {
  var mon = new Date(); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - tdy);
  var p = function (n) { return (n < 10 ? "0" : "") + n; }, f = function (d, h) { return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "T" + p(h) + "0000"; };
  var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mavisim YKS//TR"], c = 0;
  S.forEach(function (t) {
    if (t.done) return; c++;
    var d = new Date(mon); d.setDate(mon.getDate() + t.day);
    var e = t.h < 23 ? f(d, t.h + 1) : f(d, 23).slice(0, 9) + "235900";
    L.push("BEGIN:VEVENT", "UID:" + t.id + "@mavisim", "DTSTAMP:" + f(new Date(), 0), "DTSTART:" + f(d, t.h), "DTEND:" + e,
      "SUMMARY:" + t.su + " - " + t.to, "DESCRIPTION:" + (t.note || t.ex), "BEGIN:VALARM", "TRIGGER:-PT10M", "ACTION:DISPLAY", "DESCRIPTION:Calisma vakti", "END:VALARM", "END:VEVENT");
  });
  if (!c) { toast("Takvime aktarılacak görev yok."); return; }
  L.push("END:VCALENDAR");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([L.join("\r\n")], { type: "text/calendar" })); a.download = "yks-plan.ics"; a.click();
};

renderG(); ns(); tick();
updCd(); render(true);

</script>
</body>
</html>
